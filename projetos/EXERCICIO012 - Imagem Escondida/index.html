<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem Escondida - Exercício 012</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1><svg class="icon" style="width:1em;height:1em;vertical-align:-0.125em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Imagem Escondida</h1>
            <p class="subtitle">Passa o rato sobre a área para revelar a imagem</p>

            <!-- Área onde a imagem está escondida -->
            <div id="areaImagem" class="area-imagem">
                <div class="imagem-wrapper">
                    <img id="imagemRevelar" src="WhatsApp Image 2026-05-06 at 16.23.35.jpeg" alt="Imagem revelada" class="imagem-revelar">
                </div>
                <div class="texto-overlay">
                    <span class="icone-overlay"><svg style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
                    <p>Passe o rato aqui para revelar a imagem</p>
                    <span class="seta"><svg style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
                </div>
            </div>

            <!-- Mensagem de estado -->
            <div id="estado" class="estado">
                <span id="estadoTexto">Imagem escondida</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

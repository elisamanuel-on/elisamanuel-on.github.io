    <div class="container">
        <header class="topo">
            <div class="marca">
                <img src="icone.svg" alt="" width="46" height="46">
                <div>
                    <h1 id="titulo">Imagem Escondida</h1>
                    <p id="subtitulo" class="subtitle"></p>
                </div>
            </div>
            <div class="topo-acoes">
                <label class="seletor">
                    <span id="rotulo-idioma" class="so-leitor">Idioma</span>
                    <select id="idioma"></select>
                </label>
                <button id="btn-jogador" class="chip-jogador" type="button"></button>
            </div>
        </header>

        <main>
            <!-- Jogadores e ranking -->
            <section id="ecra-jogadores" class="card" hidden>
                <h2 id="jogadores-titulo"></h2>
                <p id="jogadores-info" class="nota"></p>
                <ul id="lista-jogadores" class="lista-jogadores"></ul>
                <form id="form-jogador" class="form-jogador" autocomplete="off">
                    <h3 id="form-titulo"></h3>
                    <label for="nome-jogador" id="rotulo-nome"></label>
                    <input id="nome-jogador" type="text" maxlength="16" spellcheck="false">
                    <p id="rotulo-avatar" class="rotulo"></p>
                    <div id="avatares" class="avatares" role="radiogroup"></div>
                    <p id="erro-jogador" class="erro" role="alert" hidden></p>
                    <div class="linha-botoes">
                        <button id="btn-criar" class="botao" type="submit"></button>
                        <button id="btn-fechar-jogadores" class="botao secundario" type="button"></button>
                    </div>
                </form>
                <h3 id="ranking-titulo"></h3>
                <ol id="ranking" class="ranking"></ol>
            </section>

            <!-- Menu: os 3 níveis -->
            <section id="ecra-inicio" class="card">
                <div id="niveis" class="niveis"></div>
                <details class="regras" open>
                    <summary id="regras-titulo"></summary>
                    <p id="regras-texto"></p>
                </details>
            </section>

            <!-- Jogo -->
            <section id="ecra-jogo" class="card" hidden>
                <div class="hud">
                    <div class="hud-nivel"><span id="hud-nivel" class="selo"></span><span id="hud-pergunta" class="pequeno"></span></div>
                    <div class="hud-valores">
                        <div class="hud-item" title="">
                            <span id="hud-vidas" class="vidas" role="img"></span>
                        </div>
                        <div class="hud-item"><span class="hud-rotulo" id="rot-pontos"></span><strong id="hud-pontos">0</strong></div>
                        <div class="hud-item"><span class="hud-rotulo" id="rot-seq"></span><strong id="hud-seq">0</strong></div>
                        <div class="hud-item hud-tempo"><svg class="ic" aria-hidden="true"><use href="#i-relogio"/></svg><strong id="hud-tempo">0</strong></div>
                    </div>
                </div>
                <div class="barra-tempo" aria-hidden="true"><div id="barra-tempo"></div></div>
                <div class="progresso" id="progresso" aria-hidden="true"></div>

                <div id="palco" class="palco">
                    <h2 id="pergunta" class="pergunta"></h2>
                    <div id="conteudo" class="conteudo"></div>
                    <div id="opcoes" class="opcoes"></div>
                    <form id="form-escrita" class="form-escrita" autocomplete="off" hidden>
                        <input id="resposta-escrita" type="text" maxlength="60" spellcheck="false" autocapitalize="off" autocorrect="off">
                        <button id="btn-responder" class="botao" type="submit"></button>
                    </form>
                    <p id="dica" class="nota dica"></p>
                </div>

                <div id="mapa-caixa" class="mapa-caixa" hidden>
                    <div id="mapa" class="mapa" role="application"></div>
                    <p id="aviso-mapa" class="aviso-mapa" role="status" hidden></p>
                </div>

                <div id="feedback" class="feedback" aria-live="polite" hidden>
                    <p id="feedback-msg" class="feedback-msg"></p>
                    <div class="feedback-grelha">
                        <div id="ficha" class="ficha"></div>
                        <div id="curiosidade" class="curiosidade"></div>
                    </div>
                    <div class="linha-botoes">
                        <a id="ligacao-google" class="botao secundario" target="_blank" rel="noopener noreferrer"></a>
                        <a id="ligacao-wiki" class="botao secundario" target="_blank" rel="noopener noreferrer" hidden></a>
                        <button id="btn-seguinte" class="botao" type="button"></button>
                    </div>
                </div>

                <button id="btn-sair" class="botao texto" type="button"></button>
            </section>

            <!-- Fim do nível -->
            <section id="ecra-fim" class="card" hidden>
                <div id="fim-conteudo" class="fim"></div>
            </section>
        </main>

        <footer class="rodape">
            <p id="rodape-fontes"></p>
            <p><span id="rodape-versao"></span> · <span id="rodape-total"></span></p>
        </footer>

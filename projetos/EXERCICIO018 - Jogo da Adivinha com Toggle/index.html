<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Adivinha - Exercício 018</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Toggle Dark/Light Mode -->
            <div class="toggle-container">
                <button id="toggleMode" class="btn-toggle"><span class="toggle-icone"><svg style="width:1em;height:1em;vertical-align:-0.125em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span> Dark Mode</button>
            </div>

            <h1><svg class="icon" style="width:1em;height:1em;vertical-align:-0.125em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg> Jogo da Adivinha</h1>
            <p class="subtitle">Tente adivinhar o número entre <strong>1 e 50</strong></p>

            <!-- Status do Jogo -->
            <div class="status">
                <div class="status-item">
                    <span class="status-label"><svg class="icon" style="width:0.85em;height:0.85em;vertical-align:-0.1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg> Número Secreto</span>
                    <span id="numeroSecreto" class="status-valor">???</span>
                </div>
                <div class="status-item">
                    <span class="status-label"><svg class="icon" style="width:0.85em;height:0.85em;vertical-align:-0.1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> Tentativas</span>
                    <span id="tentativas" class="status-valor">0</span>
                </div>
            </div>

            <!-- Área de Input -->
            <div class="input-group">
                <input type="number" id="palpite" placeholder="Digite um número (1-50)" min="1" max="50">
                <button id="adivinharBtn"><svg class="icon" style="width:1em;height:1em;vertical-align:-0.125em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Adivinhar</button>
            </div>

            <!-- Botão Reiniciar -->
            <button id="reiniciarBtn" class="btn-reiniciar"><svg class="icon" style="width:1em;height:1em;vertical-align:-0.125em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> Novo Jogo</button>

            <!-- Mensagem de Erro -->
            <div id="erro" class="erro"></div>

            <!-- Dica -->
            <div id="dica" class="dica">
                <span class="dica-icone"><svg style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5.76.76 1.23 1.52 1.41 2.5"/></svg></span>
                <span id="dicaTexto">Digite um número e tente adivinhar!</span>
            </div>

            <!-- Histórico de Tentativas -->
            <div id="historico" class="historico">
                <h3><svg class="icon" style="width:0.9em;height:0.9em;vertical-align:-0.1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg> Histórico de Tentativas</h3>
                <div id="listaTentativas" class="lista-tentativas">
                    <span style="color: var(--cor-texto-secundario);">Nenhuma tentativa ainda...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

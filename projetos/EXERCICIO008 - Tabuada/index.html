<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada - Exercício 008</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1><svg class="icon" style="width:1em;height:1em;vertical-align:-0.125em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> Tabuada da Elisama</h1>
            <p class="subtitle">Digite um número e veja sua tabuada</p>

            <div class="input-group">
                <input type="number" id="numero" placeholder="Ex: 7" min="0">
                <button id="calcular">Calcular</button>
            </div>

            <div id="erro" class="erro"></div>

            <div id="resultado">
                <div class="tabuada-header">
                    <span>Tabuada do <strong id="numTabuada">?</strong></span>
                </div>
                <div id="tabuadaLista" class="tabuada-lista">
                    <span style="color: #4a5568;">Aguardando número...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

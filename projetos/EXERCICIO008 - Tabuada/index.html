<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada em Jogos · Elisama Manuel</title>
    <meta name="description" content="Tabuada em jogos para crianças: labirinto, quiz com tempo, caça aos múltiplos e memória.">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2.0.1">
</head>
<body>
    <div class="app">
        <header class="topo">
            <button type="button" class="marca" id="marcaBtn">
                <span class="marca-mascote" id="logoMascote"></span>
                <span class="marca-texto">
                    <span class="marca-nome" data-i18n="titulo">Tabuada em Jogos</span>
                    <span class="marca-sub" data-i18n="subtitulo">Aprende e joga</span>
                </span>
            </button>
            <div class="topo-direita">
                <span class="estrelas-total" id="estrelasTotal" role="status">
                    <span class="estrela-icone" aria-hidden="true"></span><b>0</b>
                </span>
                <button type="button" class="btn-som" id="somBtn" data-i18n-aria="som_aria" aria-pressed="true"></button>
                <label class="idioma-caixa">
                    <span class="so-leitor" data-i18n="idioma">Idioma</span>
                    <select id="idioma"></select>
                </label>
            </div>
        </header>

        <main id="ecra"></main>

        <footer class="rodape">
            <span id="versao">v2.0.1</span>
            <span>Elisama Manuel</span>
        </footer>
    </div>

    <div class="aviso" id="aviso" role="status" aria-live="polite"></div>
    <canvas id="confete" aria-hidden="true"></canvas>

    <noscript><p style="padding:20px;text-align:center">Este jogo precisa de JavaScript.</p></noscript>

    <script src="idiomas.js?v=2.0.1"></script>
    <script src="comum.js?v=2.0.1"></script>
    <script src="aprender.js?v=2.0.1"></script>
    <script src="labirinto.js?v=2.0.1"></script>
    <script src="quiz.js?v=2.0.1"></script>
    <script src="caca.js?v=2.0.1"></script>
    <script src="memoria.js?v=2.0.1"></script>
    <script>Tabuada.iniciar();</script>
</body>
</html>

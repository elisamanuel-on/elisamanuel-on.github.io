<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora 4 Operações - Exercício 013</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1><svg class="icon" style="width:1em;height:1em;vertical-align:-0.125em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="8.01" y2="10"/><line x1="12" y1="10" x2="12.01" y2="10"/><line x1="16" y1="10" x2="16.01" y2="10"/><line x1="8" y1="14" x2="8.01" y2="14"/><line x1="12" y1="14" x2="12.01" y2="14"/><line x1="16" y1="14" x2="16.01" y2="14"/><line x1="8" y1="18" x2="16" y2="18"/></svg> Calculadora 4 Operações</h1>
            <p class="subtitle">Insira dois números e veja os resultados</p>

            <!-- Inputs -->
            <div class="input-group">
                <div class="input-field">
                    <label for="num1">Primeiro Número</label>
                    <input type="number" id="num1" placeholder="Insira um número" step="any">
                </div>
                
                <div class="input-field">
                    <label for="num2">Segundo Número</label>
                    <input type="number" id="num2" placeholder="Insira um número" step="any">
                </div>
            </div>

            <!-- Botão -->
            <button id="calcularBtn">Calcular</button>

            <!-- Mensagem de Erro -->
            <div id="erro" class="erro"></div>

            <!-- Resultados -->
            <div id="resultados" class="resultados-area">
                <div class="resultado-item">
                    <span class="resultado-icon">+</span>
                    <div class="resultado-conteudo">
                        <h3>Soma</h3>
                        <p id="somaResult">Aguardando números...</p>
                    </div>
                </div>

                <div class="resultado-item">
                    <span class="resultado-icon">−</span>
                    <div class="resultado-conteudo">
                        <h3>Subtração</h3>
                        <p id="subtracaoResult">Aguardando números...</p>
                    </div>
                </div>

                <div class="resultado-item">
                    <span class="resultado-icon">×</span>
                    <div class="resultado-conteudo">
                        <h3>Multiplicação</h3>
                        <p id="multiplicacaoResult">Aguardando números...</p>
                    </div>
                </div>

                <div class="resultado-item divisao">
                    <span class="resultado-icon">÷</span>
                    <div class="resultado-conteudo">
                        <h3>Divisão</h3>
                        <p id="divisaoResult">Aguardando números...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

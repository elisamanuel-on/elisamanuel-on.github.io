<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curiosidades do Mundo · Exercício 011</title>
    <meta name="description" content="Curiosidades reais da Wikipédia por áreas, com mais dados para revelar ao clicar.">
    <link rel="icon" href="icone.svg?v=2.0.0" type="image/svg+xml">
    <link rel="stylesheet" href="style.css?v=2.0.0">
</head>
<body>
    <div class="container">
        <div class="card">
            <header class="cabecalho">
                <div class="idioma-caixa">
                    <label for="idioma" id="rotulo-idioma">Idioma</label>
                    <select id="idioma"></select>
                </div>
                <h1><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5.76.76 1.23 1.52 1.41 2.5"/></svg> <span id="titulo">Curiosidades do Mundo</span></h1>
                <p class="subtitle" id="subtitulo">Escolhe uma área e descobre algo real da Wikipédia</p>
            </header>

            <h2 class="rotulo-areas" id="rotulo-areas">Escolhe uma área</h2>
            <div class="areas" id="areas" role="group" aria-labelledby="rotulo-areas"></div>

            <div id="resultado" class="resultado" aria-live="polite"></div>

            <footer class="rodape">
                <span id="descobertas" class="chip-info"></span>
                <p id="fonte"></p>
                <p class="versao" id="versao">Versão 2.0.0</p>
            </footer>
        </div>
    </div>

    <noscript><p style="text-align:center;color:#fc8181">JavaScript is required.</p></noscript>
    <script src="idiomas.js?v=2.0.0"></script>
    <script src="script.js?v=2.0.0"></script>
</body>
</html>

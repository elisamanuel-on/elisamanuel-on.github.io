<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números Primos - Exercício 017</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1><svg class="icon" style="width:1em;height:1em;vertical-align:-0.125em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg> Números Primos</h1>
            <p class="subtitle">Digite um número e veja todos os primos até ele</p>

            <!-- Input e Botão -->
            <div class="input-group">
                <input type="number" id="numeroInput" placeholder="Insira o número" min="2">
                <button id="calcularBtn">Ver Primos</button>
            </div>

            <!-- Botão Limpar -->
            <button id="limparBtn" class="btn-limpar"><svg class="icon" style="width:1em;height:1em;vertical-align:-0.125em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg> Limpar</button>

            <!-- Mensagem de Erro -->
            <div id="erro" class="erro"></div>

            <!-- Resultados -->
            <div id="resultados" class="resultados-area">
                <!-- Número Analisado -->
                <div class="resultado-item numero-analisado">
                    <span class="resultado-icon"><svg style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg></span>
                    <div class="resultado-conteudo">
                        <h3>Número Analisado</h3>
                        <p id="numeroAnalisado">Aguardando número...</p>
                    </div>
                </div>

                <!-- Status (primo ou não) -->
                <div class="resultado-item status-primo">
                    <span class="resultado-icon"><svg style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>
                    <div class="resultado-conteudo">
                        <h3>Status</h3>
                        <p id="statusPrimo">Aguardando número...</p>
                    </div>
                </div>

                <!-- Lista de Primos -->
                <div class="resultado-item lista-primos">
                    <span class="resultado-icon"><svg style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></span>
                    <div class="resultado-conteudo">
                        <h3>Números Primos Encontrados</h3>
                        <div id="listaPrimos" class="lista-primos-container">
                            <span style="color: #4a5568;">Aguardando número...</span>
                        </div>
                    </div>
                </div>

                <!-- Resumo -->
                <div class="resultado-item resumo">
                    <span class="resultado-icon"><svg style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>
                    <div class="resultado-conteudo">
                        <h3>Resumo</h3>
                        <p id="resumoPrimos">Aguardando número...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

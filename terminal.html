<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elisama | Terminal</title>
    <meta name="description" content="Terminal interativo do portfólio de Elisama Manuel. Escreve 'help' para explorar.">
    <link rel="stylesheet" href="style.css?v=2026.10.04-8">
    <link rel="icon" href="imagens/Ativo 30@2x.png">
</head>
<body class="pagina-pronta" data-pagina="terminal">
    <header>
        <div class="container">
            <div class="header-content">
                <nav>
                    <a href="index.html" data-i18n="nav_perfil">Perfil</a>
                    <a href="portfolio.html" data-i18n="nav_portfolio">Portfólio</a>
                    <a href="terminal.html" class="active" data-i18n="nav_terminal">Terminal</a>
                    <a href="contacto.html" data-i18n="nav_contacto">Contacto</a>
                </nav>
                <div class="controlos-topo">
                    <div class="lang-switcher" role="group" aria-label="Idioma / Language">
                        <button class="lang-btn" data-lang="pt">PT</button>
                        <button class="lang-btn" data-lang="en">EN</button>
                        <button class="lang-btn" data-lang="es">ES</button>
                        <button class="lang-btn" data-lang="fr">FR</button>
                    </div>
                    <button id="toggleTheme" class="btn-theme" aria-label="Alternar tema">
                        <span class="theme-icon"> </span>
                        <span class="theme-text">Dark</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="terminal-page">
            <div class="term-janela" id="termJanela">
                <div class="term-topo">
                    <span class="term-dot vermelho"></span>
                    <span class="term-dot amarelo"></span>
                    <span class="term-dot verde"></span>
                    <span class="term-titulo">elisama@portfolio: ~</span>
                </div>
                <div class="term-corpo" id="termOutput"></div>
                <div class="term-input-wrap">
                    <span class="term-prompt">elisama@portfolio:~$</span>
                    <input type="text" id="termInput" autocomplete="off" spellcheck="false" aria-label="Escreve um comando">
                </div>
            </div>
        </section>
        <p class="term-hint" id="termHint"></p>
    </main>

    <footer>
        <p>Elisama Manuel — <span data-i18n="footer_tagline">Tecnologias e Programação de Sistemas de Informação</span></p>
        <div class="voltar">
            <a href="index.html" class="btn btn-secundario" data-i18n="voltar_inicio">Voltar ao Início</a>
        </div>
    </footer>

    <script src="i18n.js?v=2026.10.04-8"></script>
    <script src="terminal-core.js?v=2026.10.04-8"></script>
    <script src="script.js?v=2026.10.04-8"></script>

</html>
